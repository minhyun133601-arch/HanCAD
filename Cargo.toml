[workspace]
members = ["apps/desktop/src-tauri", "crates/geometry-wasm"]
default-members = ["crates/geometry-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
